  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Sobolak Technologies iPod",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "url": "https://mrsobolak.github.io/Ipod/",
      "description": "A fully offline iPod Classic PWA with click wheel navigation, library browsing, and music playback.",
      "author": {
        "@type": "Organization",
        "name": "Sobolak Technologies"
      }
    }
  </script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/ipod.css">
  <link rel="stylesheet" href="css/screen.css">
  <link rel="stylesheet" href="css/menu.css">

  <link rel="stylesheet" href="css/media.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons&display=block">
</head>

<body class="app-loading">
  <div class="label-corner label-top-left">iPod Classic</div>
  <div class="label-corner label-top-right">Sobolak Tech</div>

  <!-- ── Device Shell ───────────────────────────────────────── -->
  <div id="ipod-container">
    <ipod-design id="ipod-component"></ipod-design>
  </div>

  <!-- Hidden file input for on-device music import (Import Music... menu item) -->
  <input type="file" id="music-file-input" accept="audio/mpeg,audio/mp3,.mp3" multiple
    style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;">
  <input type="file" id="photo-file-input" accept="image/*" multiple
    style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;">
  <input type="file" id="video-file-input" accept="video/*" multiple
    style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;">

  <div id="app-shell-loader" aria-live="polite" aria-label="Loading iPod shell">
    <div class="ipod-loader-box">
      <div class="ipod-loader-spinner" aria-hidden="true"></div>
      <div class="ipod-loader-text">BOOTING SHELL...</div>
    </div>
  </div>

  <div class="label-corner label-bottom-left">built by Sobolak Technologies</div>

  <script type="module" src="js/main.js"></script>
  <script>
    // Auto-updater: when a new service worker takes over (because a fresh
    // version was pushed), reload once so the new code actually runs instead
    // of just sitting cached-but-unused until the next cold launch.
    if ('serviceWorker' in navigator) {
      let notified = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (notified) return;
        notified = true;
        window.dispatchEvent(new CustomEvent('sw-update-ready'));
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
